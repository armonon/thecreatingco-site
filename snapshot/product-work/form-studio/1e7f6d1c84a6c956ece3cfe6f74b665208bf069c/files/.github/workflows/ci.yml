name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r requirements-ifc.txt
      - run: npm run check
      # rendered-html.test.mjs validates the actual generated Sites bundle.
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:budgets
      - run: npm run test:bim-ifc
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run release:validate

  native-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast -- --test-threads=1
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: scripts/audit-native.sh

  desktop-artifact:
    needs: [web, native-macos]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - run: FORM_ALLOW_ADHOC_SIGNATURE=1 npm run release:validate:macos
      - run: npm run test:desktop:launch
      - name: Preserve executable permissions
        run: ditto -c -k --keepParent "src-tauri/target/release/bundle/macos/Form Studio.app" form-studio-macos-app.zip
      - uses: actions/upload-artifact@v7
        with:
          name: form-studio-macos-unsigned-${{ github.sha }}
          path: |
            form-studio-macos-app.zip
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
